<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Sync Alpha 시뮬레이터</title>
    <style>
        /* 기본 다크/네온 모드 변수 */
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1a1a1a;
            --text-main: #39ff14; /* 형광 연두 */
            --text-dim: #a0a0a0;
            --border-color: #39ff14;
            --glow-effect: 0 0 10px rgba(57, 255, 20, 0.3), inset 0 0 10px rgba(57, 255, 20, 0.1);
            --accent-red: #ff073a;
            --accent-blue: #0ff;
            --btn-bg: #000;
            --btn-hover: #39ff14;
            --btn-hover-text: #000;
        }

        /* 라이트 모드 변수 */
        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-bg: #ffffff;
            --text-main: #008000;
            --text-dim: #555555;
            --border-color: #008000;
            --glow-effect: 0 4px 6px rgba(0,0,0,0.1);
            --accent-red: #d32f2f;
            --accent-blue: #0288d1;
            --btn-bg: #e0e0e0;
            --btn-hover: #008000;
            --btn-hover-text: #ffffff;
        }

        body {
            font-family: 'Courier New', Courier, monospace, 'Malgun Gothic';
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 3fr 2fr; /* 로그창 60%, 상황판 40% */
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--glow-effect);
            transition: all 0.3s ease;
        }

        .header-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-panel h1 { margin: 0; text-shadow: 0 0 5px var(--text-main); }
        .sys-info { font-weight: bold; font-size: 1.1em; color: var(--accent-blue); }

        /* 로그창을 위로 배치 */
        .log-panel {
            height: 350px;
            overflow-y: auto;
            background-color: #000;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 15px rgba(57, 255, 20, 0.1);
        }
        body.light-mode .log-panel { background-color: #fafafa; border-color: #ccc; }

        .log-entry { margin-bottom: 6px; line-height: 1.4; }
        .log-sys { color: var(--text-main); }
        .log-atk { color: var(--accent-red); font-weight: bold; }
        .log-heal { color: var(--accent-blue); }

        /* 상황판 */
        .action-panel {
            display: flex;
            flex-direction: column;
        }

        button, select {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
            text-transform: uppercase;
        }
        body.light-mode button, body.light-mode select { color: var(--text-dim); border-color: var(--border-color); }
        
        button:hover { background-color: var(--btn-hover); color: var(--btn-hover-text); box-shadow: var(--glow-effect); }
        button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        select { margin-bottom: 10px; width: 100%; }

        /* 부대 상황 (하단) */
        .roster-panel {
            grid-column: 1 / -1;
        }
        
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .char-card {
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            background-color: rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .char-card h4 { margin: 0 0 10px 0; color: var(--accent-blue); border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; }

        .bar-container { width: 100%; background-color: #222; height: 12px; border-radius: 6px; margin: 5px 0; border: 1px solid #444; }
        .bar-hp { background-color: var(--accent-red); height: 100%; border-radius: 5px; transition: width 0.3s; box-shadow: 0 0 5px var(--accent-red); }
        .bar-sp { background-color: var(--accent-blue); height: 100%; border-radius: 5px; transition: width 0.3s; box-shadow: 0 0 5px var(--accent-blue); }
        
        .mission-badge {
            position: absolute; top: 10px; right: 10px;
            font-size: 0.8em; padding: 2px 6px; border: 1px solid; border-radius: 3px;
        }

        .controls-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .action-box { border: 1px dashed var(--border-color); padding: 15px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 헤더 -->
    <div class="panel header-panel">
        <div>
            <h1>[A-SYNC ALPHA]</h1>
            <p class="sys-info">DAY: <span id="day-counter">1</span> | 요새 체력: <span id="fortress-hp">50</span></p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="toggleTheme()">테마 전환 ☼/☾</button>
            <button onclick="saveGame()">데이터 세이브</button>
            <button onclick="document.getElementById('loadInput').click()">데이터 로드</button>
            <input type="file" id="loadInput" style="display:none" accept=".json" onchange="loadGame(event)">
        </div>
    </div>

    <!-- 로그창 (상단 좌측) -->
    <div class="panel log-panel" id="log-window"></div>

    <!-- 상황판 / 액션 (상단 우측) -->
    <div class="panel action-panel">
        <h3 style="margin-top:0; border-bottom:1px solid; padding-bottom:10px;">SYSTEM OVERRIDE / 상황판</h3>
        <p id="current-phase-desc" style="color: var(--accent-blue); font-weight:bold;">시스템 부팅 및 데이터 연동 대기 중...</p>
        <div id="action-controls">
            <!-- 동적 버튼 생성 영역 -->
        </div>
    </div>

    <!-- 부대 상황 (하단) -->
    <div class="panel roster-panel">
        <h3>요원 스테이터스 목록</h3>
        <div class="char-grid" id="char-list"></div>
    </div>
</div>

<script>
    const roll = (sides) => Math.floor(Math.random() * sides) + 1;
    function logMsg(msg, type = 'sys') {
        const logWindow = document.getElementById('log-window');
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.innerText = `> ${msg}`;
        logWindow.appendChild(entry);
        logWindow.scrollTop = logWindow.scrollHeight;
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    // 게임 상태 변수
    let state = {
        day: 1,
        phase: 'standby', // standby, assign, combat, explore, fortify
        fortress: { hp: 50, maxHp: 50 },
        chars: [],
        enemiesDB: [],
        skillsDB: [],
        activeEnemies: [],
        combatTurnQueue: [],
        exploreSpots: 10
    };

    // CSV 파서 (BOM 제거 완벽 적용)
    function parseCSV(text) {
        const cleanText = text.replace(/^\uFEFF/, '');
        const lines = cleanText.trim().split(/\r?\n/);
        const headers = lines[0].split(',').map(h => h.trim());
        return lines.slice(1).map(line => {
            if (!line.trim()) return null; 
            const values = line.split(',').map(v => v.trim());
            const obj = {};
            headers.forEach((h, i) => obj[h] = values[i]);
            return obj;
        }).filter(item => item !== null);
    }

    // 데이터 연동
    async function fetchCSVData() {
        logMsg("깃허브에서 기밀 데이터(CSV) 연동을 시도합니다...", "sys");
        let dataLoaded = false;
        
        try {
            const charRes = await fetch('캐릭터.csv');
            if (charRes.ok) {
                const charData = parseCSV(await charRes.text());
                state.chars = charData.map(d => ({
                    name: d['이름'],
                    hp: parseInt(d['체력']), maxHp: parseInt(d['체력']),
                    sp: parseInt(d['기력']), maxSp: parseInt(d['기력']),
                    stats: { atk: parseInt(d['공격']), def: parseInt(d['방어']), ctrl: parseInt(d['제어']), luck: parseInt(d['행운']) },
                    skill: d['스킬'],
                    spec: d['특화'] === '전투' ? 'combat' : (d['특화'] === '탐색' ? 'explore' : 'fortify'),
                    mission: null // 임무 배정용
                }));
                logMsg("요원 데이터 로드 완료.", 'heal');
                dataLoaded = true;
            }

            const enemyRes = await fetch('에너미.csv');
            if (enemyRes.ok) {
                const enemyData = parseCSV(await enemyRes.text());
                state.enemiesDB = enemyData.map(d => ({
                    name: d['이름'], hp: parseInt(d['체력']), maxHp: parseInt(d['체력']),
                    stats: { atk: parseInt(d['공격']), def: parseInt(d['방어']), luck: parseInt(d['행운']) }
                }));
                logMsg("적성 개체 데이터 로드 완료.", 'heal');
            }

            const skillRes = await fetch('스킬.csv');
            if (skillRes.ok) {
                state.skillsDB = parseCSV(await skillRes.text());
                logMsg("이능력(스킬) 데이터 로드 완료.", 'heal');
            }
        } catch (e) {
            logMsg("[ERR] CSV 파일을 찾을 수 없습니다. (깃허브 연동 확인 요망)", 'atk');
        }

        if (dataLoaded) {
            logMsg("시스템 부팅 성공. 일과를 시작할 수 있습니다.");
            startPhase('assign');
        }
    }

    window.onload = fetchCSVData;

    // UI 업데이트 (스테이터스 보드)
    function updateUI() {
        document.getElementById('day-counter').innerText = state.day;
        document.getElementById('fortress-hp').innerText = state.fortress.hp;
        
        const roster = document.getElementById('char-list');
        roster.innerHTML = '';
        state.chars.forEach((c) => {
            const hpPct = Math.max(0, (c.hp / c.maxHp) * 100);
            const spPct = Math.max(0, (c.sp / c.maxSp) * 100);
            let missionStr = c.mission === 'combat' ? '전투' : (c.mission === 'explore' ? '탐색' : (c.mission === 'fortify' ? '보강' : '대기'));
            let specStr = c.spec === 'combat' ? '전투' : (c.spec === 'explore' ? '탐색' : '보강');
            
            roster.innerHTML += `
                <div class="char-card">
                    <span class="mission-badge" style="color:var(--accent-blue); border-color:var(--accent-blue)">현 임무: ${missionStr}</span>
                    <h4>${c.name}</h4>
                    <p style="font-size:0.85em; margin:5px 0;">특화: ${specStr} | 스킬: <span style="color:#ffeb3b">${c.skill}</span></p>
                    <p style="font-size:0.85em; margin:5px 0;">[공:${c.stats.atk} 방:${c.stats.def} 제:${c.stats.ctrl} 행:${c.stats.luck}]</p>
                    <div class="bar-container"><div class="bar-hp" style="width: ${hpPct}%"></div></div>
                    <small>HP: ${c.hp}/${c.maxHp}</small>
                    <div class="bar-container"><div class="bar-sp" style="width: ${spPct}%"></div></div>
                    <small>SP: ${c.sp}/${c.maxSp}</small>
                </div>
            `;
        });
    }

    // --- 게임 페이즈 및 시스템 로직 ---
    function startPhase(phase) {
        state.phase = phase;
        const panel = document.getElementById('action-controls');
        const desc = document.getElementById('current-phase-desc');
        updateUI();

        if (phase === 'assign') {
            desc.innerText = `[DAY ${state.day}] 요원 임무 수동 배정`;
            logMsg(`\n========== DAY ${state.day} 시작 ==========`);
            
            let html = `<div class="action-box">`;
            state.chars.forEach((c, idx) => {
                if(c.hp > 0) {
                    html += `
                        <label>${c.name} 배정:</label>
                        <select id="assign-${idx}">
                            <option value="combat">전투 임무</option>
                            <option value="explore">탐색 임무</option>
                            <option value="fortify">보강 임무</option>
                        </select>
                    `;
                }
            });
            html += `<button onclick="confirmAssignments()" style="width:100%; border-color:var(--accent-blue); color:var(--accent-blue);">배정 완료 및 전투 진입</button></div>`;
            panel.innerHTML = html;
        } 
        else if (phase === 'combat') {
            desc.innerText = `[전투 페이즈] 시스템 전투 모드 가동`;
            if(state.enemiesDB.length >= 1) {
                state.activeEnemies = [
                    JSON.parse(JSON.stringify(state.enemiesDB[Math.floor(Math.random() * state.enemiesDB.length)])),
                    JSON.parse(JSON.stringify(state.enemiesDB[Math.floor(Math.random() * state.enemiesDB.length)]))
                ];
                logMsg(`게이트 오픈. 에너미 ${state.activeEnemies.length}체 출현!`, 'atk');
            }
            
            // 전투 순서(행운) 큐 생성
            let queue = [];
            state.chars.filter(c => c.hp > 0 && c.mission === 'combat').forEach(c => {
                queue.push({type: 'char', ref: c, init: roll(6) + c.stats.luck});
            });
            state.activeEnemies.forEach(e => {
                queue.push({type: 'enemy', ref: e, init: roll(6) + e.stats.luck});
            });
            queue.sort((a, b) => b.init - a.init);
            state.combatTurnQueue = queue;

            renderCombatTurn();
        }
        else if (phase === 'explore') {
            state.exploreSpots = 10;
            desc.innerText = `[탐색 페이즈] 잔여 스팟: ${state.exploreSpots}`;
            logMsg(`\n탐색 임무를 시작합니다.`);
            renderExploreUI();
        }
        else if (phase === 'fortify') {
            let targetVal = roll(6) + 5; 
            desc.innerText = `[보강 페이즈] 목표치: ${targetVal}`;
            logMsg(`\n요새 보강 시도 (요구 목표치: ${targetVal})`);
            renderFortifyUI(targetVal);
        }
    }

    // 1. 배정 완료 처리
    function confirmAssignments() {
        let combatCount = 0;
        state.chars.forEach((c, idx) => {
            if(c.hp > 0) {
                const sel = document.getElementById(`assign-${idx}`);
                c.mission = sel.value;
                if(c.mission === 'combat') combatCount++;
            }
        });
        if(combatCount === 0) {
            logMsg("[경고] 전투에 배정된 요원이 없습니다. 즉시 전투 패배 판정이 날 수 있습니다.", "atk");
        }
        startPhase('combat');
    }

    // 2. 전투 턴 처리
    function renderCombatTurn() {
        const panel = document.getElementById('action-controls');
        
        // 전투 종료 조건 검사
        let aliveChars = state.chars.filter(c => c.hp > 0 && c.mission === 'combat');
        let aliveEnemies = state.activeEnemies.filter(e => e.hp > 0);
        
        if (state.combatTurnQueue.length === 0 || aliveChars.length === 0 || aliveEnemies.length === 0) {
            logMsg(`[전투 종료] 전투 페이즈가 마감되었습니다.`);
            panel.innerHTML = `<button onclick="startPhase('explore')">탐색 페이즈로 이동</button>`;
            return;
        }

        let entity = state.combatTurnQueue.shift();
        
        // 죽은 개체면 턴 넘김
        if (entity.ref.hp <= 0) {
            renderCombatTurn(); return;
        }

        if (entity.type === 'char') {
            // 유저 직접 조작 UI
            let targetHtml = `<select id="combat-target">`;
            aliveEnemies.forEach((e, idx) => { targetHtml += `<option value="${idx}">${e.name} (HP: ${e.hp})</option>`; });
            targetHtml += `</select>`;

            panel.innerHTML = `
                <div class="action-box" style="border-color:var(--accent-blue);">
                    <p style="color:var(--accent-blue); margin-top:0;"><strong>[▶ ${entity.ref.name}의 턴]</strong></p>
                    <label>대상 선택:</label>
                    ${targetHtml}
                    <div class="controls-row">
                        <button onclick="combatAction('attack', '${entity.ref.name}')">기본 공격</button>
                        <button onclick="combatAction('skill', '${entity.ref.name}')">스킬 사용</button>
                        <button onclick="combatAction('flee', '${entity.ref.name}')">도주 시도</button>
                    </div>
                </div>
            `;
        } else {
            // 에너미 턴 (유저가 확인 버튼 누르기)
            panel.innerHTML = `
                <div class="action-box" style="border-color:var(--accent-red);">
                    <p style="color:var(--accent-red); margin-top:0;"><strong>[▶ 적성개체 ${entity.ref.name}의 턴]</strong></p>
                    <button onclick="enemyAutoAction('${entity.ref.name}')" style="width:100%">적 행동 진행</button>
                </div>
            `;
        }
        // 턴 큐 맨 뒤로 다시 넣기 (생존 확인은 다음 팝때)
        state.combatTurnQueue.push(entity);
        updateUI();
    }

    function combatAction(actionType, charName) {
        let char = state.chars.find(c => c.name === charName);
        let targetIdx = document.getElementById('combat-target').value;
        let aliveEnemies = state.activeEnemies.filter(e => e.hp > 0);
        let target = aliveEnemies[targetIdx];

        if (actionType === 'attack') {
            let atkRoll = roll(6) + char.stats.atk;
            let defRoll = roll(6) + target.stats.def;
            logMsg(`[공격 시도] ${char.name} -> ${target.name} (공격판정:${atkRoll} vs 방어판정:${defRoll})`);
            if (atkRoll >= defRoll) {
                let dmg = roll(6);
                target.hp -= dmg;
                logMsg(`>> 명중! ${target.name}에게 ${dmg} 대미지.`, 'atk');
            } else {
                logMsg(`>> 빗나감! 상대가 방어했습니다.`);
            }
        } else if (actionType === 'flee') {
            let enemyRoll = roll(6) + target.stats.luck;
            let charRoll = roll(6) + char.stats.luck;
            logMsg(`[도주 시도] ${char.name} (행운판정:${charRoll} vs 적:${enemyRoll})`);
            if(charRoll >= enemyRoll) {
                logMsg(`>> 도주 성공! ${char.name}이(가) 이탈합니다. (요새 피해 방지)`);
                char.mission = 'escaped'; // 이번 전투에서 제외
            } else {
                logMsg(`>> 도주 실패! 발목을 잡혔습니다.`, 'atk');
            }
        } else if (actionType === 'skill') {
            if(!processSkill(char, target)) return; // 스킬 실패시 턴 종료 안넘어가게 할지 결정 (기획상 강제 턴 종료)
        }
        renderCombatTurn();
    }

    function enemyAutoAction(enemyName) {
        let enemy = state.activeEnemies.find(e => e.name === enemyName);
        let aliveChars = state.chars.filter(c => c.hp > 0 && c.mission === 'combat');
        
        let targetChar = aliveChars.length > 0 ? aliveChars[Math.floor(Math.random() * aliveChars.length)] : null;

        if (Math.random() > 0.3 && targetChar) {
            let atkRoll = roll(6) + enemy.stats.atk;
            let defRoll = roll(6) + targetChar.stats.def;
            if (atkRoll >= defRoll) {
                let dmg = roll(6);
                targetChar.hp = Math.max(0, targetChar.hp - dmg);
                logMsg(`[적 공격] ${enemy.name} -> ${targetChar.name} 명중! (${dmg} 피해)`, 'atk');
            } else {
                 logMsg(`[적 공격] ${enemy.name} -> ${targetChar.name} 공격을 회피/방어했습니다!`);
            }
        } else {
            let dmg = roll(6);
            state.fortress.hp -= dmg;
            logMsg(`[적 요새 공격] ${enemy.name} -> 요새에 ${dmg} 피해!`, 'atk');
        }
        renderCombatTurn();
    }

    // 3. 탐색 페이즈 처리
    function renderExploreUI() {
        const panel = document.getElementById('action-controls');
        let explorers = state.chars.filter(c => c.hp > 0 && c.mission === 'explore');
        
        if (state.exploreSpots <= 0 || explorers.length === 0) {
            panel.innerHTML = `<p>탐색 가능 스팟이 없거나 탐색 요원이 없습니다.</p><button onclick="startPhase('fortify')">보강 페이즈로 이동</button>`;
            return;
        }

        let charHtml = `<select id="exp-char">`;
        explorers.forEach((c, idx) => charHtml += `<option value="${idx}">${c.name} (특화:${c.spec})</option>`);
        charHtml += `</select>`;

        panel.innerHTML = `
            <div class="action-box">
                <label>탐색자 선택:</label> ${charHtml}
                <label>판정 스탯 선택:</label>
                <select id="exp-stat">
                    <option value="atk">공격력 (강행 돌파)</option>
                    <option value="ctrl">제어력 (함정 해체)</option>
                    <option value="luck">행운 (직감 탐색)</option>
                </select>
                <div class="controls-row">
                    <button onclick="doExplore()">탐색 판정 실시</button>
                    <button onclick="useExploreSkill()" style="border-color:#ffeb3b">스킬 발동</button>
                </div>
                <button onclick="startPhase('fortify')" style="width:100%; border-color:#555;">탐색 즉시 종료 (보강 이동)</button>
            </div>
        `;
    }

    function doExplore() {
        let explorers = state.chars.filter(c => c.hp > 0 && c.mission === 'explore');
        let charIdx = document.getElementById('exp-char').value;
        let char = explorers[charIdx];
        let statType = document.getElementById('exp-stat').value;

        state.exploreSpots--;
        let targetVal = roll(6) + 3; // 목표치 4~9
        
        let rollVal = roll(6) + char.stats[statType];
        if (char.spec !== 'explore') rollVal += 1; // 비특화 행운/스탯 보정 (+1)

        logMsg(`[탐색 시도] ${char.name} (목표치:${targetVal} / 굴림:${rollVal})`);

        if (rollVal >= targetVal) {
            logMsg(`>> 탐색 성공! 아이템을 발견했습니다.`, 'heal');
            // source2 기반 아이템 확률
            const pool = [
                {name:"붕대", c:35},{name:"피로 회복제", c:25},{name:"구급 상자", c:20},
                {name:"비타민", c:10},{name:"전문 응급 처치 키트", c:6},{name:"전문 피로 회복 키트", c:4}
            ];
            let r = Math.random()*100, w = 0;
            for(let i of pool){
                w += i.c;
                if(r <= w){ logMsg(`[획득] ${i.name}`, 'sys'); break; }
            }
        } else {
            logMsg(`>> 탐색 실패. 함정에 빠져 체력 1 차감.`, 'atk');
            char.hp = Math.max(0, char.hp - 1);
        }
        
        document.getElementById('current-phase-desc').innerText = `[탐색 페이즈] 잔여 스팟: ${state.exploreSpots}`;
        updateUI();
        renderExploreUI();
    }

    // 4. 보강 페이즈 처리
    function renderFortifyUI(targetVal) {
        const panel = document.getElementById('action-controls');
        let fortifiers = state.chars.filter(c => c.hp > 0 && c.mission === 'fortify');
        
        if (fortifiers.length === 0) {
            panel.innerHTML = `<p>보강 요원이 없습니다.</p><button onclick="endDay()">하루 종료</button>`;
            return;
        }

        let charHtml = `<select id="fort-char">`;
        fortifiers.forEach((c, idx) => charHtml += `<option value="${idx}">${c.name}</option>`);
        charHtml += `</select>`;

        panel.innerHTML = `
            <div class="action-box">
                <label>보강자 선택:</label> ${charHtml}
                <label>판정 스탯 선택:</label>
                <select id="fort-stat">
                    <option value="def">방어력 (구조물 보강)</option>
                    <option value="ctrl">제어력 (시스템 수리)</option>
                    <option value="luck">행운 (임시 땜질)</option>
                </select>
                <div class="controls-row">
                    <button onclick="doFortify(${targetVal})">보강 판정 실시</button>
                    <button onclick="useFortifySkill()" style="border-color:#ffeb3b">스킬 발동</button>
                </div>
                <button onclick="endDay()" style="width:100%; border-color:#555;">보강 즉시 종료</button>
            </div>
        `;
    }

    function doFortify(targetVal) {
        let fortifiers = state.chars.filter(c => c.hp > 0 && c.mission === 'fortify');
        let charIdx = document.getElementById('fort-char').value;
        let char = fortifiers[charIdx];
        let statType = document.getElementById('fort-stat').value;

        let rollVal = roll(6) + char.stats[statType];
        if (char.spec !== 'fortify') rollVal += 1;

        logMsg(`[보강 시도] ${char.name} (목표치:${targetVal} / 굴림:${rollVal})`);

        if (rollVal >= targetVal) {
            let heal = roll(6);
            state.fortress.hp += heal;
            logMsg(`>> 보강 성공! 요새 체력이 ${heal} 회복되었습니다.`, 'heal');
            document.getElementById('action-controls').innerHTML = `<button onclick="endDay()">하루 종료</button>`;
        } else {
            logMsg(`>> 보강 실패. 과도한 업무로 기력 1 차감.`);
            char.sp = Math.max(0, char.sp - 1);
        }
        updateUI();
    }

    // --- 공용 스킬 판정 시스템 (Req 6) ---
    function processSkill(char, targetObj = null) {
        let spCost = roll(4) + 2;
        logMsg(`[이능력 발동] ${char.name}의 '${char.skill}' (요구 기력: ${spCost})`);
        
        if (char.sp < spCost) {
            logMsg(`>> 시스템 에러: 기력이 부족합니다. (현재:${char.sp}) 스킬 발동 무효 및 턴 종료.`, 'atk');
            return true; // 턴 넘김
        }
        char.sp -= spCost; // 기력 차감

        let targetControl = roll(3) + 6; // [7~9] 사이 랜덤
        let ctrlRoll = roll(6) + char.stats.ctrl;
        
        logMsg(`[제어 판정] (목표치:${targetControl} vs 굴림:${ctrlRoll})`);
        if (ctrlRoll >= targetControl) {
            logMsg(`>> 제어 성공! 스킬 효과가 적용됩니다.`, 'heal');
            // 스킬 이름 기반 범용 효과 처리
            if (char.skill.includes('치료') || char.skill.includes('회복')) {
                char.hp = Math.min(char.maxHp, char.hp + 5);
                logMsg(`[효과] 체력을 대폭 회복했습니다.`, 'heal');
            } else if (char.skill.includes('강타') || char.skill.includes('공격')) {
                if(targetObj) {
                    targetObj.hp -= 10;
                    logMsg(`[효과] 대상에게 10의 관통 대미지!`, 'atk');
                }
            } else if (char.skill.includes('방벽') || char.skill.includes('보호')) {
                state.fortress.hp += 5;
                logMsg(`[효과] 요새 체력을 5 보충했습니다.`, 'heal');
            } else {
                logMsg(`[효과] 특수 이능력이 발현되었습니다! (보너스 스탯 판정 등)`);
            }
        } else {
            logMsg(`>> 제어 실패. 기력만 소모하고 효과는 발생하지 않았습니다.`, 'atk');
        }
        updateUI();
        return true;
    }

    function useExploreSkill() {
        let explorers = state.chars.filter(c => c.hp > 0 && c.mission === 'explore');
        let charIdx = document.getElementById('exp-char').value;
        processSkill(explorers[charIdx]);
    }

    function useFortifySkill() {
        let fortifiers = state.chars.filter(c => c.hp > 0 && c.mission === 'fortify');
        let charIdx = document.getElementById('fort-char').value;
        processSkill(fortifiers[charIdx]);
    }

    // 일과 종료
    function endDay() {
        if (state.fortress.hp <= 0) {
            logMsg(`[CRITICAL] 요새 체력 0. 방어선 붕괴! 전 인원 체력 페널티.`, 'atk');
            state.chars.forEach(c => { c.hp = Math.max(0, c.hp - roll(4)); });
        }
        
        // 보강 안 한 인원 휴식 로직
        state.chars.forEach(c => {
            if(c.mission === 'fortify' && c.hp > 0) {
                // (기획: 보강 판정 진행하지 않은 캐릭터 회복 - 간략화 적용)
                c.hp = Math.min(c.maxHp, c.hp + roll(2));
                c.sp = Math.min(c.maxSp, c.sp + roll(2));
            }
        });

        logMsg(`========== DAY ${state.day} 종료 ==========\n`);
        state.day++;
        startPhase('assign');
    }

    function saveGame() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `ASyncAlpha_Save_Day${state.day}.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        logMsg("데이터 세이브 완료.");
    }

    function loadGame(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            state = JSON.parse(e.target.result);
            updateUI();
            logMsg("백업 데이터 로드 완료.");
            startPhase(state.phase);
        };
        reader.readAsText(file);
    }
</script>
