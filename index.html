<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Sync Alpha 시뮬레이터</title>
    <style>
        /* 기본 다크/네온 모드 변수 */
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1a1a1a;
            --text-main: #39ff14; /* 형광 연두 */
            --text-dim: #a0a0a0;
            --border-color: #39ff14;
            --glow-effect: 0 0 10px rgba(57, 255, 20, 0.3), inset 0 0 10px rgba(57, 255, 20, 0.1);
            --accent-red: #ff073a;
            --accent-blue: #0ff;
            --btn-bg: #000;
            --btn-hover: #39ff14;
            --btn-hover-text: #000;
        }

        /* 라이트 모드 변수 */
        body.light-mode {
            --bg-color: #f0f0f0;
            --panel-bg: #ffffff;
            --text-main: #008000;
            --text-dim: #555555;
            --border-color: #008000;
            --glow-effect: 0 4px 6px rgba(0,0,0,0.1);
            --accent-red: #d32f2f;
            --accent-blue: #0288d1;
            --btn-bg: #e0e0e0;
            --btn-hover: #008000;
            --btn-hover-text: #ffffff;
        }

        body {
            font-family: 'Courier New', Courier, monospace, 'Malgun Gothic';
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 3fr 2fr; /* 로그창 60%, 상황판+인벤 40% */
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--glow-effect);
            transition: all 0.3s ease;
        }

        .header-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-panel h1 { margin: 0; text-shadow: 0 0 5px var(--text-main); }
        .sys-info { font-weight: bold; font-size: 1.1em; color: var(--accent-blue); }

        /* 로그창 */
        .log-panel {
            height: 450px;
            overflow-y: auto;
            background-color: #000;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 15px rgba(57, 255, 20, 0.1);
        }
        body.light-mode .log-panel { background-color: #fafafa; border-color: #ccc; }

        .log-entry { margin-bottom: 6px; line-height: 1.4; }
        .log-sys { color: var(--text-main); }
        .log-atk { color: var(--accent-red); font-weight: bold; }
        .log-heal { color: var(--accent-blue); }

        /* 우측 패널 그룹 (상황판 + 인벤토리) */
        .right-column { display: flex; flex-direction: column; gap: 20px; }

        button, select {
            background-color: var(--btn-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
            text-transform: uppercase;
        }
        body.light-mode button, body.light-mode select { color: var(--text-dim); border-color: var(--border-color); }
        
        button:hover { background-color: var(--btn-hover); color: var(--btn-hover-text); box-shadow: var(--glow-effect); }
        button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        select { margin-bottom: 10px; width: 100%; }

        /* 부대 상황 */
        .roster-panel { grid-column: 1 / -1; }
        .char-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .char-card {
            border: 1px solid var(--border-color); padding: 15px; border-radius: 6px;
            background-color: rgba(0, 0, 0, 0.3); position: relative;
        }
        .char-card h4 { margin: 0 0 10px 0; color: var(--accent-blue); border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; }
        .bar-container { width: 100%; background-color: #222; height: 12px; border-radius: 6px; margin: 5px 0; border: 1px solid #444; }
        .bar-hp { background-color: var(--accent-red); height: 100%; border-radius: 5px; transition: width 0.3s; box-shadow: 0 0 5px var(--accent-red); }
        .bar-sp { background-color: var(--accent-blue); height: 100%; border-radius: 5px; transition: width 0.3s; box-shadow: 0 0 5px var(--accent-blue); }
        .mission-badge { position: absolute; top: 10px; right: 10px; font-size: 0.8em; padding: 2px 6px; border: 1px solid; border-radius: 3px; }

        .controls-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .action-box { border: 1px dashed var(--border-color); padding: 15px; border-radius: 5px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 헤더 -->
    <div class="panel header-panel">
        <div>
            <h1>[A-SYNC ALPHA]</h1>
            <p class="sys-info">DAY: <span id="day-counter">1</span> | 요새 체력: <span id="fortress-hp">50</span></p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="toggleTheme()">테마 전환 ☼/☾</button>
            <button onclick="saveGame()">데이터 세이브</button>
            <button onclick="document.getElementById('loadInput').click()">데이터 로드</button>
            <input type="file" id="loadInput" style="display:none" accept=".json" onchange="loadGame(event)">
        </div>
    </div>

    <!-- 로그창 -->
    <div class="panel log-panel" id="log-window"></div>

    <!-- 우측 구역 -->
    <div class="right-column">
        <!-- 상황판 -->
        <div class="panel action-panel">
            <h3 style="margin-top:0; border-bottom:1px solid; padding-bottom:10px;">SYSTEM OVERRIDE / 상황판</h3>
            <p id="current-phase-desc" style="color: var(--accent-blue); font-weight:bold;">시스템 부팅 및 데이터 연동 대기 중...</p>
            <div id="action-controls"></div>
        </div>
        
        <!-- 인벤토리 -->
        <div class="panel inventory-panel">
            <h3 style="margin-top:0; border-bottom:1px solid var(--accent-blue); color:var(--accent-blue); padding-bottom:10px;">[INVENTORY] 보급품</h3>
            <div id="inventory-container"></div>
        </div>
    </div>

    <!-- 부대 상황 -->
    <div class="panel roster-panel">
        <h3>요원 스테이터스 목록</h3>
        <div class="char-grid" id="char-list"></div>
    </div>
</div>

<script>
    const roll = (sides) => Math.floor(Math.random() * sides) + 1;
    function logMsg(msg, type = 'sys') {
        const logWindow = document.getElementById('log-window');
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.innerText = `> ${msg}`;
        logWindow.appendChild(entry);
        logWindow.scrollTop = logWindow.scrollHeight;
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); }

    // 게임 코어 스테이트
    let state = {
        day: 1, phase: 'standby',
        fortress: { hp: 50, maxHp: 50 },
        chars: [], enemiesDB: [], skillsDB: [],
        activeEnemies: [], combatTurnQueue: [],
        exploreSpots: 10, currentExploreTarget: 0, meteorDashSpots: 0,
        inventory: { "붕대": 0, "피로 회복제": 0, "구급 상자": 0, "비타민": 0, "전문 응급 처치 키트": 0, "전문 피로 회복 키트": 0 }
    };

    function parseCSV(text) {
        const cleanText = text.replace(/^\uFEFF/, '');
        const lines = cleanText.trim().split(/\r?\n/);
        const headers = lines[0].split(',').map(h => h.trim());
        return lines.slice(1).map(line => {
            if (!line.trim()) return null; 
            const values = line.split(',').map(v => v.trim());
            const obj = {};
            headers.forEach((h, i) => obj[h] = values[i]);
            return obj;
        }).filter(item => item !== null);
    }

    async function fetchCSVData() {
        logMsg("데이터베이스 연동을 시도합니다...", "sys");
        let dataLoaded = false;
        
        try {
            // 파일명 수정 완료!
            const charRes = await fetch('캐릭터.csv');
            if (charRes.ok) {
                const charData = parseCSV(await charRes.text());
                state.chars = charData.map(d => ({
                    name: d['이름'],
                    hp: parseInt(d['체력']), maxHp: parseInt(d['체력']),
                    sp: parseInt(d['기력']), maxSp: parseInt(d['기력']),
                    stats: { atk: parseInt(d['공격']), def: parseInt(d['방어']), ctrl: parseInt(d['제어']), luck: parseInt(d['행운']) },
                    skill: d['스킬'],
                    spec: d['특화'] === '전투' ? 'combat' : (d['특화'] === '탐색' ? 'explore' : 'fortify'),
                    mission: null,
                    buffs: { autoExplore: 0, exploreBonus: false, barrier: 0, awakening: null }
                }));
                logMsg("요원 데이터 로드 완료.", 'heal');
                dataLoaded = true;
            }

            const enemyRes = await fetch('에너미.csv');
            if (enemyRes.ok) {
                const enemyData = parseCSV(await enemyRes.text());
                state.enemiesDB = enemyData.map(d => ({
                    name: d['이름'], hp: parseInt(d['체력']), maxHp: parseInt(d['체력']),
                    stats: { atk: parseInt(d['공격']), def: parseInt(d['방어']), luck: parseInt(d['행운']) },
                    status: { stun: 0, burn: 0 }
                }));
                logMsg("적성 개체 데이터 로드 완료.", 'heal');
            }

            // 파일명 수정 완료!
            const skillRes = await fetch('스킬.csv');
            if (skillRes.ok) {
                state.skillsDB = parseCSV(await skillRes.text());
                logMsg("이능력 데이터 로드 완료.", 'heal');
            }
        } catch (e) {
            logMsg("[ERR] CSV 파일을 찾을 수 없습니다. 깃허브 연동을 확인하세요.", 'atk');
        }

        if (dataLoaded) {
            renderInventory();
            startPhase('assign');
        }
    }

    window.onload = fetchCSVData;

    // 실시간 버프 포함 스탯 계산기
    function getStat(char, statName) {
        let val = char.stats[statName];
        if (char.buffs && char.buffs.awakening === statName) val += 1;
        return val;
    }

    // UI & 인벤토리 렌더링
    function updateUI() {
        document.getElementById('day-counter').innerText = state.day;
        document.getElementById('fortress-hp').innerText = state.fortress.hp;
        
        const roster = document.getElementById('char-list');
        roster.innerHTML = '';
        state.chars.forEach((c) => {
            const hpPct = Math.max(0, (c.hp / c.maxHp) * 100);
            const spPct = Math.max(0, (c.sp / c.maxSp) * 100);
            let mStr = c.mission === 'combat' ? '전투' : (c.mission === 'explore' ? '탐색' : (c.mission === 'fortify' ? '보강' : (c.mission === 'escaped' ? '전투이탈' : '대기')));
            
            roster.innerHTML += `
                <div class="char-card" style="${c.hp<=0?'opacity:0.5':''}">
                    <span class="mission-badge" style="color:var(--accent-blue); border-color:var(--accent-blue)">현 임무: ${mStr}</span>
                    <h4>${c.name}</h4>
                    <p style="font-size:0.85em; margin:5px 0;">특화: ${c.spec} | 스킬: <span style="color:#ffeb3b">${c.skill}</span></p>
                    <p style="font-size:0.85em; margin:5px 0;">[공:${getStat(c,'atk')} 방:${getStat(c,'def')} 제:${getStat(c,'ctrl')} 행:${getStat(c,'luck')}]</p>
                    <div class="bar-container"><div class="bar-hp" style="width: ${hpPct}%"></div></div>
                    <small>HP: ${c.hp}/${c.maxHp}</small>
                    <div class="bar-container"><div class="bar-sp" style="width: ${spPct}%"></div></div>
                    <small>SP: ${c.sp}/${c.maxSp}</small>
                </div>
            `;
        });
        renderInventory();
    }

    function renderInventory() {
        let html = `<div style="display:flex; flex-wrap:wrap; gap:5px;">`;
        let hasItem = false;
        for(let item in state.inventory) {
            if(state.inventory[item] > 0) {
                hasItem = true;
                html += `<button onclick="prepareUseItem('${item}')" style="font-size:0.85em; padding:5px 10px;">${item} (${state.inventory[item]})</button>`;
            }
        }
        html += `</div>`;
        if(!hasItem) html = `<p style="color:var(--text-dim); font-size:0.9em; margin:0;">보급품이 존재하지 않습니다.</p>`;
        html += `<div id="item-target-div" style="margin-top:15px; display:none;"></div>`;
        document.getElementById('inventory-container').innerHTML = html;
    }

    function prepareUseItem(itemName) {
        let div = document.getElementById('item-target-div');
        div.style.display = 'block';
        let html = `<label>${itemName} 투여:</label><select id="item-target-char" style="width:auto; margin:0 10px; padding:5px;">`;
        state.chars.filter(c => c.hp > 0).forEach(c => html += `<option value="${c.name}">${c.name}</option>`);
        html += `</select><button onclick="useItem('${itemName}')" style="background:var(--accent-blue); color:#000; padding:5px 15px;">사용</button>`;
        div.innerHTML = html;
    }

    function useItem(itemName) {
        if (state.inventory[itemName] <= 0) return;
        let targetName = document.getElementById('item-target-char').value;
        let char = state.chars.find(c => c.name === targetName);
        state.inventory[itemName]--;
        
        let heal = 0;
        if(itemName === '붕대') { heal = roll(4); char.hp = Math.min(char.maxHp, char.hp + heal); logMsg(`[아이템] ${char.name} 붕대 사용: 체력 ${heal} 회복`, 'heal'); }
        else if(itemName === '피로 회복제') { heal = roll(4); char.sp = Math.min(char.maxSp, char.sp + heal); logMsg(`[아이템] ${char.name} 피로 회복제 사용: 기력 ${heal} 회복`, 'heal'); }
        else if(itemName === '구급 상자') { heal = roll(4) + 2; char.hp = Math.min(char.maxHp, char.hp + heal); logMsg(`[아이템] ${char.name} 구급 상자 사용: 체력 ${heal} 회복`, 'heal'); }
        else if(itemName === '비타민') { heal = roll(4) + 2; char.sp = Math.min(char.maxSp, char.sp + heal); logMsg(`[아이템] ${char.name} 비타민 사용: 기력 ${heal} 회복`, 'heal'); }
        else if(itemName === '전문 응급 처치 키트') { heal = roll(6) + 2; char.hp = Math.min(char.maxHp, char.hp + heal); logMsg(`[아이템] ${char.name} 전문 응급 처치 키트 사용: 체력 ${heal} 회복`, 'heal'); }
        else if(itemName === '전문 피로 회복 키트') { heal = roll(6) + 2; char.sp = Math.min(char.maxSp, char.sp + heal); logMsg(`[아이템] ${char.name} 전문 피로 회복 키트 사용: 기력 ${heal} 회복`, 'heal'); }
        updateUI();
    }

    // --- 게임 진행 페이즈 ---
    function startPhase(phase) {
        state.phase = phase;
        const panel = document.getElementById('action-controls');
        const desc = document.getElementById('current-phase-desc');
        updateUI();

        if (phase === 'assign') {
            desc.innerText = `[DAY ${state.day}] 요원 임무 수동 배정`;
            logMsg(`\n========== DAY ${state.day} 시작 ==========`);
            let html = `<div class="action-box">`;
            state.chars.forEach((c, idx) => {
                if(c.hp > 0) {
                    c.mission = 'combat'; // Default
                    html += `<label>${c.name} 배정:</label><select id="assign-${idx}">
                            <option value="combat">전투 임무</option><option value="explore">탐색 임무</option><option value="fortify">보강 임무</option></select>`;
                }
            });
            html += `<button onclick="confirmAssignments()" style="width:100%; border-color:var(--accent-blue); color:var(--accent-blue);">배정 완료 및 전투 진입</button></div>`;
            panel.innerHTML = html;
        } 
        else if (phase === 'combat') {
            desc.innerText = `[전투 페이즈] 시스템 전투 모드 가동`;
            if(state.enemiesDB.length >= 1) {
                state.activeEnemies = [
                    JSON.parse(JSON.stringify(state.enemiesDB[Math.floor(Math.random() * state.enemiesDB.length)])),
                    JSON.parse(JSON.stringify(state.enemiesDB[Math.floor(Math.random() * state.enemiesDB.length)]))
                ];
                logMsg(`게이트 오픈. 에너미 ${state.activeEnemies.length}체 출현!`, 'atk');
            }
            
            let queue = [];
            state.chars.filter(c => c.hp > 0 && c.mission === 'combat').forEach(c => queue.push({type: 'char', ref: c, init: roll(6) + getStat(c,'luck')}));
            state.activeEnemies.forEach(e => queue.push({type: 'enemy', ref: e, init: roll(6) + e.stats.luck}));
            queue.sort((a, b) => b.init - a.init);
            state.combatTurnQueue = queue;
            renderCombatTurn();
        }
        else if (phase === 'explore') {
            state.exploreSpots = 10;
            logMsg(`\n탐색 임무를 시작합니다.`);
            generateExploreTarget();
            renderExploreUI();
        }
        else if (phase === 'fortify') {
            let targetVal = roll(6) + 5; 
            desc.innerText = `[보강 페이즈] 목표치: ${targetVal}`;
            logMsg(`\n요새 보강 시도 (요구 목표치: ${targetVal})`);
            renderFortifyUI(targetVal);
        }
    }

    function confirmAssignments() {
        state.chars.forEach((c, idx) => {
            if(c.hp > 0) c.mission = document.getElementById(`assign-${idx}`).value;
        });
        startPhase('combat');
    }

    // 전투 로직
    function renderCombatTurn() {
        let aliveChars = state.chars.filter(c => c.hp > 0 && c.mission === 'combat');
        let aliveEnemies = state.activeEnemies.filter(e => e.hp > 0);
        const panel = document.getElementById('action-controls');
        
        if (state.combatTurnQueue.length === 0 || aliveChars.length === 0 || aliveEnemies.length === 0) {
            logMsg(`[전투 종료] 전투 페이즈가 마감되었습니다.`);
            panel.innerHTML = `<button onclick="startPhase('explore')" style="width:100%">탐색 페이즈로 이동</button>`;
            return;
        }

        let entity = state.combatTurnQueue[0]; // 큐의 맨 앞(현재 턴)
        
        // 사망자 및 도주자 턴 건너뛰기 완벽 차단
        if ((entity.type === 'char' && (entity.ref.hp <= 0 || entity.ref.mission !== 'combat')) || 
            (entity.type === 'enemy' && entity.ref.hp <= 0)) {
            state.combatTurnQueue.push(state.combatTurnQueue.shift());
            return renderCombatTurn();
        }

        if (entity.type === 'char') {
            let targetHtml = `<select id="combat-target">`;
            aliveEnemies.forEach(e => { targetHtml += `<option value="${e.name}">${e.name} (HP: ${e.hp})</option>`; });
            targetHtml += `</select>`;

            panel.innerHTML = `
                <div class="action-box" style="border-color:var(--accent-blue);">
                    <p style="color:var(--accent-blue); margin-top:0;"><strong>[▶ 요원 ${entity.ref.name}의 턴]</strong></p>
                    <label>대상 선택:</label>${targetHtml}
                    <div class="controls-row">
                        <button onclick="combatAction('attack')">기본 공격</button>
                        <button onclick="combatAction('skill')" style="border-color:#ffeb3b">스킬 발동</button>
                        <button onclick="combatAction('flee')">도주 시도</button>
                    </div>
                </div>
            `;
        } else {
            panel.innerHTML = `
                <div class="action-box" style="border-color:var(--accent-red);">
                    <p style="color:var(--accent-red); margin-top:0;"><strong>[▶ 적성개체 ${entity.ref.name}의 턴]</strong></p>
                    <button onclick="enemyAutoAction()" style="width:100%">적 행동 시뮬레이션</button>
                </div>
            `;
        }
        updateUI();
    }

    function combatAction(actionType) {
        let char = state.combatTurnQueue[0].ref;
        if (actionType === 'skill') {
            prepareSkill(char.name, 'combat');
            return; 
        }

        let target = state.activeEnemies.find(e => e.name === document.getElementById('combat-target').value);

        if (actionType === 'attack') {
            let atkRoll = roll(6) + getStat(char, 'atk');
            let defRoll = roll(6) + target.stats.def;
            logMsg(`[공격] ${char.name} -> ${target.name} (명중판정:${atkRoll} vs 방어:${defRoll})`);
            if (atkRoll >= defRoll) {
                let dmg = roll(6); target.hp -= dmg; logMsg(`>> 명중! ${dmg} 피해.`, 'atk');
            } else logMsg(`>> 회피/방어됨.`);
        } else if (actionType === 'flee') {
            let enemyRoll = roll(6) + target.stats.luck;
            let charRoll = roll(6) + getStat(char, 'luck');
            logMsg(`[도주] ${char.name} (행운판정:${charRoll} vs 적:${enemyRoll})`);
            if(charRoll >= enemyRoll) {
                logMsg(`>> 도주 성공! ${char.name}이(가) 전투에서 완전히 이탈합니다.`);
                char.mission = 'escaped'; 
            } else logMsg(`>> 도주 실패! 발목이 잡혔습니다.`, 'atk');
        }

        state.combatTurnQueue.push(state.combatTurnQueue.shift()); // 턴 종료
        renderCombatTurn();
    }

    function enemyAutoAction() {
        let enemy = state.combatTurnQueue[0].ref;
        
        if (enemy.status.stun > 0) {
            logMsg(`[상태이상] ${enemy.name} 기절 상태! 행동 불가. (잔여: ${enemy.status.stun}턴)`, 'heal');
            enemy.status.stun--;
        } else {
            let aliveChars = state.chars.filter(c => c.hp > 0 && c.mission === 'combat');
            let targetChar = aliveChars.length > 0 ? aliveChars[Math.floor(Math.random() * aliveChars.length)] : null;

            if (Math.random() > 0.3 && targetChar) {
                let atkRoll = roll(6) + enemy.stats.atk;
                let defRoll = roll(6) + getStat(targetChar, 'def');
                if (atkRoll >= defRoll) {
                    let dmg = roll(6);
                    if (targetChar.buffs.barrier > 0) {
                        targetChar.buffs.barrier--;
                        logMsg(`[절대영도 방벽] ${targetChar.name}의 방벽이 공격을 완전히 무효화했습니다! (잔여방벽: ${targetChar.buffs.barrier})`, 'heal');
                    } else {
                        targetChar.hp = Math.max(0, targetChar.hp - dmg);
                        logMsg(`[적 공격] ${enemy.name} -> ${targetChar.name} 명중! (${dmg} 피해)`, 'atk');
                    }
                } else logMsg(`[적 공격] ${enemy.name} -> ${targetChar.name} 빗나감!`);
            } else {
                let dmg = roll(6); state.fortress.hp -= dmg;
                logMsg(`[적 요새 공격] ${enemy.name} -> 요새에 ${dmg} 피해!`, 'atk');
            }
        }
        
        if (enemy.status.burn > 0) {
            enemy.hp -= 1; enemy.status.burn--;
            logMsg(`[상태이상] ${enemy.name} 화상 대미지 1 발생. (잔여: ${enemy.status.burn}턴)`, 'atk');
        }

        state.combatTurnQueue.push(state.combatTurnQueue.shift());
        renderCombatTurn();
    }

    // 탐색 로직 (미리 목표치 표시 기능 추가)
    function generateExploreTarget() {
        let base = roll(6) + 3; // 4~9
        if (state.meteorDashSpots > 0) { base -= 1; state.meteorDashSpots--; logMsg(`(메테오 대시 효과: 스팟 목표치 1 하락)`, 'sys'); }
        state.currentExploreTarget = base;
    }

    function renderExploreUI() {
        const panel = document.getElementById('action-controls');
        let explorers = state.chars.filter(c => c.hp > 0 && c.mission === 'explore');
        document.getElementById('current-phase-desc').innerText = `[탐색 페이즈] 잔여 스팟: ${state.exploreSpots}`;
        
        if (state.exploreSpots <= 0 || explorers.length === 0) {
            panel.innerHTML = `<p>탐색 가능 스팟이 없거나 요원이 없습니다.</p><button onclick="startPhase('fortify')" style="width:100%">보강 페이즈로 이동</button>`;
            return;
        }

        let charHtml = `<select id="exp-char">`;
        explorers.forEach((c, idx) => charHtml += `<option value="${idx}">${c.name} (특화:${c.spec})</option>`);
        charHtml += `</select>`;

        panel.innerHTML = `
            <div class="action-box">
                <h4 style="margin-top:0; color:var(--accent-red)">발견된 스팟 목표치: ${state.currentExploreTarget}</h4>
                <label>탐색 요원 선택:</label> ${charHtml}
                <label>판정 스탯 선택:</label>
                <select id="exp-stat"><option value="atk">공격력 (강행 돌파)</option><option value="ctrl">제어력 (함정 해체)</option><option value="luck">행운 (직감 탐색)</option></select>
                <div class="controls-row">
                    <button onclick="doExplore()">탐색 판정 실시</button>
                    <button onclick="prepareSkill(state.chars.filter(c=>c.hp>0&&c.mission==='explore')[document.getElementById('exp-char').value].name, 'explore')" style="border-color:#ffeb3b">스킬 발동</button>
                </div>
                <button onclick="startPhase('fortify')" style="width:100%; border-color:#555;">탐색 즉시 종료</button>
            </div>
        `;
    }

    function doExplore() {
        let char = state.chars.filter(c => c.hp > 0 && c.mission === 'explore')[document.getElementById('exp-char').value];
        let statType = document.getElementById('exp-stat').value;
        let targetVal = state.currentExploreTarget;
        let charRoll = roll(6) + getStat(char, statType);
        
        if (char.spec !== 'explore') charRoll += 1;
        if (char.buffs.exploreBonus) charRoll += 2; // 폭풍의 도약 버프

        logMsg(`[탐색 시도] ${char.name} (목표치:${targetVal} / 최종 굴림값:${charRoll})`);

        if (char.buffs.autoExplore > 0) {
            char.buffs.autoExplore--;
            logMsg(`>> [어둠의 장막] 탐색이 강제로 성공 처리됩니다! (잔여 버프: ${char.buffs.autoExplore}회)`, 'heal');
            exploreSuccess();
        } else if (charRoll >= targetVal) {
            logMsg(`>> 탐색 성공!`, 'heal');
            exploreSuccess();
        } else {
            logMsg(`>> 탐색 실패. 함정에 빠져 체력 1 차감.`, 'atk');
            char.hp = Math.max(0, char.hp - 1);
        }
        
        state.exploreSpots--;
        if(state.exploreSpots > 0) generateExploreTarget();
        updateUI(); renderExploreUI();
    }

    function exploreSuccess() {
        const pool = [ {name:"붕대", c:35},{name:"피로 회복제", c:25},{name:"구급 상자", c:20}, {name:"비타민", c:10},{name:"전문 응급 처치 키트", c:6},{name:"전문 피로 회복 키트", c:4} ];
        let r = Math.random()*100, w = 0;
        for(let i of pool){ w += i.c; if(r <= w){ logMsg(`[아이템 획득] ${i.name}`, 'sys'); state.inventory[i.name]++; break; } }
    }

    // 보강 로직
    function renderFortifyUI(targetVal) {
        const panel = document.getElementById('action-controls');
        let fortifiers = state.chars.filter(c => c.hp > 0 && c.mission === 'fortify');
        
        if (fortifiers.length === 0) { panel.innerHTML = `<p>보강 요원이 없습니다.</p><button onclick="endDay()" style="width:100%">하루 종료</button>`; return; }

        let charHtml = `<select id="fort-char">`;
        fortifiers.forEach((c, idx) => charHtml += `<option value="${idx}">${c.name}</option>`);
        charHtml += `</select>`;

        panel.innerHTML = `
            <div class="action-box">
                <label>보강 요원 선택:</label> ${charHtml}
                <label>판정 스탯 선택:</label>
                <select id="fort-stat"><option value="def">방어력</option><option value="ctrl">제어력</option><option value="luck">행운</option></select>
                <div class="controls-row">
                    <button onclick="doFortify(${targetVal})">보강 판정 실시</button>
                    <button onclick="prepareSkill(state.chars.filter(c=>c.hp>0&&c.mission==='fortify')[document.getElementById('fort-char').value].name, 'fortify')" style="border-color:#ffeb3b">스킬 발동</button>
                </div>
                <button onclick="endDay()" style="width:100%; border-color:#555;">보강 즉시 종료</button>
            </div>
        `;
    }

    function doFortify(targetVal) {
        let char = state.chars.filter(c => c.hp > 0 && c.mission === 'fortify')[document.getElementById('fort-char').value];
        let rollVal = roll(6) + getStat(char, document.getElementById('fort-stat').value);
        if (char.spec !== 'fortify') rollVal += 1;

        logMsg(`[보강 시도] ${char.name} (목표치:${targetVal} / 최종 굴림값:${rollVal})`);
        if (rollVal >= targetVal) {
            let heal = roll(6); state.fortress.hp += heal;
            logMsg(`>> 보강 성공! 요새 체력이 ${heal} 회복되었습니다.`, 'heal');
            document.getElementById('action-controls').innerHTML = `<button onclick="endDay()" style="width:100%">하루 종료</button>`;
        } else {
            logMsg(`>> 보강 실패. 과도한 업무로 기력 1 차감.`); char.sp = Math.max(0, char.sp - 1);
        }
        updateUI();
    }

    // --- 스킬 10종 완벽 대응 시스템 ---
    function prepareSkill(charName, phase) {
        const char = state.chars.find(c => c.name === charName);
        let html = `<div class="action-box" style="border-color:#ffeb3b;"><h4 style="margin:0 0 10px 0; color:#ffeb3b;">스킬 타겟 설정: [${char.skill}]</h4>`;
        
        let allyOpts = ""; state.chars.filter(c => c.hp > 0).forEach(c => allyOpts += `<option value="${c.name}">${c.name}</option>`);
        let enemyOpts = ""; state.activeEnemies.filter(e => e.hp > 0).forEach(e => enemyOpts += `<option value="${e.name}">${e.name} (HP:${e.hp})</option>`);
        let statOpts = `<option value="atk">공격</option><option value="def">방어</option><option value="ctrl">제어</option><option value="luck">행운</option>`;

        if (char.skill === '정화의 파도') {
            html += `<label>대상:</label><select id="sk-tgt1">${allyOpts}</select><br><label>회복:</label><select id="sk-opt1"><option value="hp">체력</option><option value="sp">기력</option></select>`;
        } else if (char.skill === '맹독의 정수') {
            html += `<label>대상 1:</label><select id="sk-tgt1">${allyOpts}</select> 스탯: <select id="sk-opt1">${statOpts}</select><br>`;
            html += `<label>대상 2:</label><select id="sk-tgt2">${allyOpts}</select> 스탯: <select id="sk-opt2">${statOpts}</select>`;
        } else if (['절대영도', '어둠의 장막', '폭풍의 도약'].includes(char.skill)) {
            html += `<label>대상:</label><select id="sk-tgt1">${allyOpts}</select>`;
        } else if (['플레임 스트라이크', '페이트 오브 스틸'].includes(char.skill)) {
            html += `<label>적 대상:</label><select id="sk-tgt1">${enemyOpts}</select>`;
        } else {
            html += `<p style="font-size:0.9em">시스템 전체 혹은 적 전체 타겟 스킬입니다. 별도 지정이 필요 없습니다.</p>`;
        }

        html += `<div class="controls-row" style="margin-top:15px;">
            <button onclick="executeSkill('${char.name}', '${phase}')" style="background-color:#ffeb3b; color:#000;">발동 시작</button>
            <button onclick="cancelSkill('${phase}')">취소</button>
        </div></div>`;
        document.getElementById('action-controls').innerHTML = html;
    }

    function cancelSkill(phase) {
        if (phase === 'combat') renderCombatTurn();
        else if (phase === 'explore') renderExploreUI();
        else renderFortifyUI(state.currentExploreTarget); // fallback
    }

    function executeSkill(charName, phase) {
        const char = state.chars.find(c => c.name === charName);
        let spCost = roll(4) + 2;
        logMsg(`[이능력 발동] ${char.name} - '${char.skill}' (요구 기력: ${spCost})`);
        
        if (char.sp < spCost) {
            logMsg(`>> 기력이 부족합니다. (현재:${char.sp}) 발동 무효.`, 'atk');
        } else {
            char.sp -= spCost;
            let targetControl = roll(3) + 6; 
            let ctrlRoll = roll(6) + getStat(char, 'ctrl');
            
            logMsg(`[제어 판정] (목표치:${targetControl} vs 굴림:${ctrlRoll})`);
            if (ctrlRoll >= targetControl) {
                logMsg(`>> 제어 성공! 스킬 효과가 발현됩니다.`, 'heal');
                applySkillEffect(char);
            } else logMsg(`>> 제어 실패. 기력만 소모되었습니다.`, 'atk');
        }
        
        updateUI();
        if (phase === 'combat') { state.combatTurnQueue.push(state.combatTurnQueue.shift()); renderCombatTurn(); }
        else if (phase === 'explore') renderExploreUI();
        else renderFortifyUI(state.currentExploreTarget);
    }

    function applySkillEffect(char) {
        let t1 = document.getElementById('sk-tgt1') ? document.getElementById('sk-tgt1').value : null;
        let t2 = document.getElementById('sk-tgt2') ? document.getElementById('sk-tgt2').value : null;
        let o1 = document.getElementById('sk-opt1') ? document.getElementById('sk-opt1').value : null;
        let o2 = document.getElementById('sk-opt2') ? document.getElementById('sk-opt2').value : null;

        let ally1 = t1 ? state.chars.find(c => c.name === t1) : null;
        let ally2 = t2 ? state.chars.find(c => c.name === t2) : null;
        let enemy1 = t1 ? state.activeEnemies.find(e => e.name === t1) : null;

        switch(char.skill) {
            case '오버차지 필드':
                let stunTurns = roll(3) + 1;
                state.activeEnemies.filter(e => e.hp > 0).forEach(e => e.status.stun = stunTurns);
                logMsg(`[효과] 모든 생존 적성개체가 ${stunTurns}턴 동안 기절합니다!`, 'heal'); break;
            case '플레임 스트라이크':
                if(enemy1) { let dmg = roll(6) + 3; let burn = roll(3); enemy1.hp -= dmg; enemy1.status.burn = burn; logMsg(`[효과] ${enemy1.name}에게 ${dmg} 피해 및 화상 ${burn}턴!`, 'atk'); } break;
            case '어둠의 장막':
                if(ally1) { ally1.buffs.autoExplore = 2; logMsg(`[효과] ${ally1.name}의 향후 탐색 2회가 강제 성공 처리됩니다!`, 'heal'); } break;
            case '폭풍의 도약':
                if(ally1) { ally1.buffs.exploreBonus = true; logMsg(`[효과] ${ally1.name}은(는) 이번 페이즈 탐색에 +2 보정을 받습니다!`, 'heal'); } break;
            case '절대영도':
                if(ally1) { ally1.buffs.barrier += 2; logMsg(`[효과] ${ally1.name}에게 2회성 방벽이 씌워졌습니다!`, 'heal'); } break;
            case '정화의 파도':
                if(ally1 && o1) { let heal = roll(10) + 2; if(o1 === 'hp') { ally1.hp = Math.min(ally1.maxHp, ally1.hp + heal); logMsg(`[효과] 체력 ${heal} 회복!`, 'heal'); } else { ally1.sp = Math.min(ally1.maxSp, ally1.sp + heal); logMsg(`[효과] 기력 ${heal} 회복!`, 'heal'); } } break;
            case '메테오 대시':
                state.meteorDashSpots = 5; logMsg(`[효과] 향후 5번의 스팟 목표치가 1씩 영구 하락합니다!`, 'heal'); break;
            case '루트 리페어':
                let fHeal = roll(6) + 2; state.fortress.hp += fHeal; logMsg(`[효과] 요새 체력이 ${fHeal} 수리되었습니다!`, 'heal'); break;
            case '페이트 오브 스틸':
                if(enemy1) {
                    let dmg = roll(4) + 2; let luckRoll = roll(6) + getStat(char, 'luck');
                    logMsg(`[효과] ${enemy1.name}에게 ${dmg} 피해! (행운 판정: ${luckRoll} vs 8)`); enemy1.hp -= dmg;
                    if(luckRoll >= 8) { let extra = roll(6) + 2; enemy1.hp -= extra; logMsg(`>> 잭팟 타격! 추가 ${extra} 피해!`, 'atk'); }
                } break;
            case '맹독의 정수':
                if(ally1 && o1) { ally1.buffs.awakening = o1; logMsg(`[효과] ${ally1.name}의 [${o1}] 각성 (+1)!`, 'heal'); }
                if(ally2 && o2) { ally2.buffs.awakening = o2; logMsg(`[효과] ${ally2.name}의 [${o2}] 각성 (+1)!`, 'heal'); } break;
        }
    }

    // 일과 종료
    function endDay() {
        if (state.fortress.hp <= 0) {
            logMsg(`[CRITICAL] 요새 방어막 붕괴. 전원 체력 피해 발생.`, 'atk');
            state.chars.forEach(c => c.hp = Math.max(0, c.hp - roll(4)));
        }
        
        state.chars.forEach(c => {
            if(c.mission === 'fortify' && c.hp > 0) { c.hp = Math.min(c.maxHp, c.hp + roll(2)); c.sp = Math.min(c.maxSp, c.sp + roll(2)); }
            c.buffs = { autoExplore: 0, exploreBonus: false, barrier: 0, awakening: null };
        });
        state.meteorDashSpots = 0;

        logMsg(`========== DAY ${state.day} 종료 ==========\n`);
        state.day++; startPhase('assign');
    }

    function saveGame() {
        const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
        a.download = `ASyncAlpha_Save_Day${state.day}.json`; document.body.appendChild(a); a.click(); a.remove();
        logMsg("데이터 세이브 완료.");
    }

    function loadGame(e) {
        const r = new FileReader();
        r.onload = function(e) { state = JSON.parse(e.target.result); updateUI(); logMsg("백업 로드 완료."); startPhase(state.phase); };
        if(e.target.files[0]) r.readAsText(e.target.files[0]);
    }
</script>
</body>
</html>
